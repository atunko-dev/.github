# The admin repo itself.
#
# Its own file rather than a tenant of meta.yml: that file owns jbang-catalog's
# merge settings and label set, and sharing it would force both onto .github.
#
# Named literally. suborgrepos uses minimatch with no options, so "*" does not
# match a dot-named repo.

suborgrepos:
  - .github

# Mirrors what the repo has live, so this PR changes no repository setting.
# Note the repo still permits merge and rebase commits while the ruleset below
# allows only squash — GitHub enforces the ruleset, so the effect is squash-only.
# Narrowing the repo settings to match is a separate decision, not smuggled in
# with the protection.
repository:
  allow_squash_merge: true
  allow_merge_commit: true
  allow_rebase_merge: true
  allow_auto_merge: false
  delete_branch_on_merge: false
  squash_merge_commit_title: COMMIT_OR_PR_TITLE
  squash_merge_commit_message: COMMIT_MESSAGES
  has_issues: true
  has_projects: true
  has_wiki: true

# No `labels:` key, deliberately. Declaring one here would make this PR
# destructive: the repo carries the nine stock GitHub labels, and any label
# absent from a declared list is deleted. Labels arrive with the Renovate
# config, where the full live set gets reproduced and verified.

rulesets:
  - name: protect-main
    target: branch
    enforcement: active
    conditions:
      ref_name:
        include:
          - refs/heads/main
        exclude: []
    # RepositoryRole 5 (admin), NOT OrganizationAdmin.
    #
    # OrganizationAdmin cannot converge: GitHub ignores actor_id for that
    # actor_type and always returns null, which safe-settings' diff cannot
    # match. Declared as null the entry never deploys; declared as 1 it deploys
    # and is then re-applied on every single sync, forever. See
    # github-community-projects/safe-settings#1034.
    #
    # A bypass is not optional here: the ruleset requires an approval, the repo
    # has a single maintainer, and GitHub does not let an author approve their
    # own PR. Without it no change could ever land on this repo.
    bypass_actors:
      - actor_id: 5
        actor_type: RepositoryRole
        bypass_mode: always
    rules:
      - type: deletion
      - type: non_fast_forward
      - type: required_linear_history
      - type: pull_request
        parameters:
          required_approving_review_count: 1
          dismiss_stale_reviews_on_push: true
          require_code_owner_review: false
          require_last_push_approval: false
          required_review_thread_resolution: true
          require_extra_approval_for_unattributed_changes: true
          allowed_merge_methods:
            - squash
      - type: required_status_checks
        parameters:
          strict_required_status_checks_policy: false
          do_not_enforce_on_create: false
          # DCO is the only check that runs on every PR here, confirmed on a
          # real PR head. The safe-settings workflow is deliberately absent: it
          # has no pull_request trigger at all, so requiring it would block
          # every PR forever.
          required_status_checks:
            - context: DCO
              integration_id: 1861

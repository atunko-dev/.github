# Which repos safe-settings will not touch.
#
# This file being present is load-bearing: when it is absent safe-settings
# restores its own defaults (admin, .github, safe-settings), so deleting it
# silently changes scope rather than widening it.
#
# .github is the admin repo and excludes itself. There are no archived repos
# in atunko-dev today; add any that appear, because safe-settings cannot write
# to an archived repo and one failed write fails the entire run, not just that
# repo.

restrictedRepos:
  exclude:
    - .github
